<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AMBER</title>
    <link rel="stylesheet" href="/xterm/css/xterm.css">
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <div class="mobile-block" role="alert">
      <p>Sorry, this really only works on desktop with a keyboard.</p>
    </div>
    <main class="crt-shell" aria-label="AMBER terminal">
      <section class="terminal-bezel">
        <div class="terminal-toolbar" aria-hidden="true">
          <span>AMBER</span>
          <span>80x25</span>
          <span id="link-state">CONNECTING</span>
        </div>
        <div class="screen">
          <div id="terminal"></div>
          <div class="scanline"></div>
        </div>
      </section>
      <a class="gh-link" href="https://github.com/dmd/amber" target="_blank" rel="noopener noreferrer">AMBER source on GitHub</a>
    </main>
    <script src="/xterm/lib/xterm.js"></script>
    <script src="/xterm-canvas/lib/addon-canvas.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
